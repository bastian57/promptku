plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.daftech.promptku'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daftech.promptku'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '2.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables { useSupportLibrary = true }
    }

    // Pola keystore TETAP (terbukti di SuaraKu v1.0.2 + UnduhKu):
    // keystore didecode secret KEYSTORE_BASE64 ke WORKSPACE signing/
    // promptku-tetap.keystore, BUKAN ke ~/.android/debug.keystore
    // (pola tanam ~/.android gagal diam-diam dan bikin signature acak).
    // File keystore TIDAK masuk repo (lihat .gitignore signing/).
    signingConfigs {
        tetap {
            storeFile rootProject.file('signing/promptku-tetap.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file('signing/promptku-tetap.keystore').exists()) {
                signingConfig signingConfigs.tetap
            }
        }
        debug {
            // Tanpa suffix .debug supaya package tetap com.daftech.promptku.
            // Kunci tetap dipakai kalau file keystore hasil decode secret ada (CI);
            // lokal tanpa file itu jatuh ke debug keystore bawaan.
            if (rootProject.file('signing/promptku-tetap.keystore').exists()) {
                signingConfig signingConfigs.tetap
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose = true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.15' }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    def composeBom = '2024.06.00'
    implementation platform("androidx.compose:compose-bom:$composeBom")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
    implementation 'androidx.core:core-ktx:1.13.1'

    // Room 2.6.1 — pin yang terbukti aman untuk Kotlin 1.9.25.
    // Room 2.7.0+ menarik kotlin-stdlib 2.1.x yang tidak bisa dibaca
    // compiler Kotlin 1.9.25. Jangan naikkan diam-diam.
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // v2.0 — BYOK cloud (Gemini + Groq). Versi PERSIS yang dipakai
    // UnduhKu (terbukti hijau di CI yang sama): OkHttp + coroutines +
    // EncryptedSharedPreferences. Jangan naikkan diam-diam.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
}
